<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #2F3C7E, #1B9AAA);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      padding: 24px;
    }
    h1 {
      color: #2F3C7E;
      font-size: 28px;
      margin-bottom: 6px;
      text-align: center;
    }
    .counter {
      text-align: center;
      font-size: 20px;
      color: #555;
      margin-bottom: 18px;
      background: #FFF6F0;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #F96167;
    }
    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    #input {
      flex: 1;
      font-size: 22px;
      padding: 12px 14px;
      border: 2px solid #ccc;
      border-radius: 10px;
      outline: none;
    }
    #input:focus { border-color: #1B9AAA; }
    button { cursor: pointer; font-size: 18px; }
    #add {
      padding: 12px 18px;
      background: #1B9AAA;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      white-space: nowrap;
    }
    #add:hover { background: #1590a0; }
    ul#list { list-style: none; margin-bottom: 16px; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid #eee;
      font-size: 22px;
    }
    li .label {
      flex: 1;
      word-break: break-word;
    }
    li.done .label {
      text-decoration: line-through;
      color: #999;
    }
    li input[type="checkbox"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      flex-shrink: 0;
    }
    li .del {
      background: none;
      border: none;
      color: #E86A92;
      font-size: 24px;
      line-height: 1;
      padding: 4px 8px;
      flex-shrink: 0;
    }
    li .del:hover { color: #c2456e; }
    .clear-wrap { text-align: right; }
    #clearDone {
      background: #F96167;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
    }
    #clearDone:hover { background: #e04a50; }
    #clearDone:disabled { background: #f5c6c9; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="app">
    <h1>📋 To-Do List</h1>
    <div class="counter" id="counter">未完成 0／總數 0</div>

    <form id="form">
      <input id="input" type="text" placeholder="輸入新待辦事項…" autocomplete="off">
      <button id="add" type="submit">新增</button>
    </form>

    <ul id="list"></ul>

    <div class="clear-wrap">
      <button id="clearDone" type="button" disabled>一鍵清除已完成</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "todo-list-v1";
    let todos = [];

    // 從 localStorage 載入
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        todos = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(todos)) todos = [];
      } catch (e) {
        todos = [];
      }
    }
    // 存入 localStorage
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // 頂部計數：未完成 X／總數 Y
    function renderCounter() {
      const undone = todos.filter(t => !t.done).length;
      document.getElementById("counter").textContent =
        "未完成 " + undone + "／總數 " + todos.length;
    }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      todos.forEach(function(todo, i) {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = todo.done;
        cb.addEventListener("change", function() {
          todos[i].done = cb.checked;
          save();
          render();
        });

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.title = "刪除此項目";
        del.addEventListener("click", function() {
          todos.splice(i, 1);
          save();
          render();
        });

        li.appendChild(cb);
        li.appendChild(label);
        li.appendChild(del);
        list.appendChild(li);
      });
      renderCounter();

      // 有已完成項目才啟用清除按鈕
      const hasDone = todos.some(t => t.done);
      document.getElementById("clearDone").disabled = !hasDone;
    }

    // 新增
    document.getElementById("form").addEventListener("submit", function(e) {
      e.preventDefault();
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text: text, done: false });
      input.value = "";
      save();
      render();
    });

    // 一鍵清除已完成
    document.getElementById("clearDone").addEventListener("click", function() {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    load();
    render();
  </script>
</body>
</html>
